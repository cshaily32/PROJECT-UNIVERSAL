    <rect x="1.5" y="1.5" width="1021" height="1021" rx="149" fill="none" stroke="#323452" stroke-opacity=".28" stroke-width="3"/>
    <!-- Ribbon P with a play-shaped negative-space opening -->
    <path fill="url(#mark)" fill-rule="evenodd" d="
      M278 840 L278 462 C278 348 350 278 466 278 L586 278
