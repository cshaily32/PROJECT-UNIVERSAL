    <path d="M278 840 C278 788 313 750 371 718 L432 684 L432 758 Z" fill="url(#fold)"/>
    <path d="M280 839 C292 783 340 752 432 700" fill="none" stroke="#E9D7FF" stroke-opacity=".24" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
