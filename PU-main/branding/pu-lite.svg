<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>PU Lite app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101126"/><stop offset="1" stop-color="#090B20"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#222044" stop-opacity=".28"/><stop offset="1" stop-color="#080A1D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1=".12" y1=".05" x2=".92" y2=".9">
      <stop offset="0" stop-color="#E5C8FF"/><stop offset=".25" stop-color="#B77BFA"/>
      <stop offset=".52" stop-color="#7657F4"/><stop offset=".78" stop-color="#38BDF4"/>
      <stop offset="1" stop-color="#8DEBFF"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B7FF" stop-opacity=".94"/><stop offset=".55" stop-color="#8C76FF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#4F8DFF" stop-opacity=".28"/>
